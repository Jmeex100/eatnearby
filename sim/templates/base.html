<!DOCTYPE html>
<html lang="en" id="html">
<head>
    {% load static %}
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Eat Nearby">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Eat Nearby">
    <meta name="description" content="Find and order food from nearby restaurants">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="theme-color" content="#000000">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eat near-by</title>
    
    <script>
        // Check for dark mode preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('{% static "js/service-worker.js" %}')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
        
        // PWA installation prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('PWA can be installed');
            
            // Optional: Show install button
            showInstallPromotion();
        });
        
        function showInstallPromotion() {
            // You can add a custom install button here
            console.log('Show your install button here');
        }
        
        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</head>
<body class="dark:bg-dark-background text-gray-800 dark:text-dark-text">
    {% include "navbar.html" %}
    <br>
    <main class="flex-grow">
        {% block content %}
        {% endblock content %}
        {% block extra_js %}{% endblock %}
    </main>
    {% include "footer.html" %}
</body>
</html>
